name: Merge sync pull requests

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only report what would be merged
        default: false
        type: boolean
      merge-method:
        description: How to merge the pull requests
        default: squash
        type: choice
        options:
          - squash
          - merge
          - rebase

env:
  NODE_VERSION: 24.14.1

jobs:
  prepare-owners:
    name: Prepare owners
    runs-on: ubuntu-latest
    outputs:
      owners: ${{ steps.owners.outputs.owners }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read owners
        id: owners
        run: echo "owners=$(jq -c '[.repositories[].name | split("/")[0]] | unique' repositories.json)" >> "$GITHUB_OUTPUT"

  merge:
    name: Merge for ${{ matrix.owner }}
    runs-on: ubuntu-latest
    needs: prepare-owners
    strategy:
      fail-fast: false
      matrix:
        owner: ${{ fromJson(needs.prepare-owners.outputs.owners) }}
    steps:
      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          owner: ${{ matrix.owner }}
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm i

      - name: Merge sync pull requests
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          OWNER: ${{ matrix.owner }}
        run: pnpm merge
