name: autofix.ci

on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

env:
  NODE_VERSION: 24.14.1

jobs:
  autofix:
    if: contains(github.event.head_commit.message, 'deploy') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm i

      - name: Run prettier
        run: pnpm exec prettier . --write

      # Optimize all PNGs with https://pngquant.org/
      - run: sudo apt-get update && sudo apt-get install -y pngquant
      - name: Run pngquant
        run: |
          shopt -s globstar
          find . -name '*.png' -exec pngquant --ext .png --force 256 {} \;

      - name: Sort Files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readFileSync, writeFileSync } = require('node:fs');
            const data = JSON.parse(readFileSync('repos.json', 'utf8'));
            if (!data.repositories) process.exit(1);

            const gk = o => (o.targetPath || '').toLowerCase().split('/').map((s, i, a) => [s, i === a.length - 1 && s.includes('.')]);

            data.repositories.forEach(r => r.files?.sort((a, b) => {
              const ka = gk(a), kb = gk(b);
              for (let i = 0; i < Math.min(ka.length, kb.length); i++) {
                if (ka[i][0] !== kb[i][0]) return ka[i][0] < kb[i][0] ? -1 : 1;
                if (ka[i][1] !== kb[i][1]) return ka[i][1] ? 1 : -1;
              }
              return ka.length - kb.length;
            }));

            writeFileSync('repos.json', JSON.stringify(data, null, 2) + '\n');

      - uses: autofix-ci/action@7a166d7532b277f34e16238930461bf77f9d7ed8
