name: Update Template Files Across Repos

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: template-files
  NODE_VERSION: 24.14.1

jobs:
  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm i

      - name: Create Release Pull Request
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        id: changesets
        with:
          version-script: pnpm run version
          commit-message: "ci: release"
          pr-title: "ci: release [skip netlify]"
          github-token: ${{ steps.generate_token.outputs.token}}
          push-with-git-cli: true

      - name: Get published version
        if: steps.changesets.outputs.has-changesets == 'true'
        run: |
          git checkout changeset-release/main
          VERSION=$(node -p "require('./package.json').version")
          git commit --amend -m "ci: release ${{ env.IMAGE_NAME }} v$VERSION" --no-edit
          git push origin changeset-release/main:changeset-release/main --force

  prepare-matrix:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.matrix.outputs.repositories }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read repositories
        id: matrix
        run: echo "repositories=$(jq -c '[.repositories[].name]' repositories.json)" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync ${{ matrix.repository }}
    runs-on: ubuntu-latest
    needs: [changesets, prepare-matrix]
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJson(needs.prepare-matrix.outputs.repositories) }}
    if: >
      (
        needs.changesets.outputs.has-changesets == 'false' &&
        (
          contains(github.event.head_commit.message, 'deploy') ||
          contains(github.event.head_commit.message, 'release')
        )
      ) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          owner: ${{ github.repository_owner }}
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm i

      - name: Sync template files
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          REPOSITORY: ${{ matrix.repository }}
        run: pnpm sync

      - name: Sanitize repository name
        run: echo "SANITIZED_REPOSITORY=${REPOSITORY//\//-}" >> "$GITHUB_ENV"
        env:
          REPOSITORY: ${{ matrix.repository }}

      - name: Upload summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: summary-${{ env.SANITIZED_REPOSITORY }}
          path: summary/*.json

  summarize:
    name: Synchronization Report
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm i

      - name: Download summaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: summary
          pattern: summary-*
          merge-multiple: true

      - name: Generate reports
        run: pnpm report summary

      - name: Upload final summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-summary
          path: summary/final_summary.md

      - name: Upload discord summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discord-summary
          path: summary/discord_summary.md

      - name: Display summary in the GitHub Actions summary
        run: cat summary/final_summary.md >> "$GITHUB_STEP_SUMMARY"

  image-tag:
    name: Image Tag
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAG: ${{ env.IMAGE_TAG }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "IMAGE_TAG=$VERSION" >> $GITHUB_ENV

  release:
    name: Release
    needs: [sync, image-tag, summarize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: extract-changelog
        uses: sean0x42/markdown-extract@7b185cbe85263116bbf741e739e7198ba86465dc # v2.1.0
        with:
          file: CHANGELOG.md
          pattern: ${{ needs.image-tag.outputs.IMAGE_TAG }}

      - name: Download summary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-summary

      - name: Download summary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: discord-summary

      - name: Save summary into Github environment variable
        run: |
          {
            echo "SYNC_SUMMARY<<EOF"
            cat final_summary.md
            echo "EOF"
          } >> $GITHUB_ENV

          {
            echo "DISCORD_SUMMARY<<EOF"
            cat discord_summary.md
            echo "EOF"
          } >> $GITHUB_ENV

      - uses: ncipollo/release-action@v1
        id: create_release
        with:
          tag: ${{ env.IMAGE_NAME }}@${{ needs.image-tag.outputs.IMAGE_TAG }}
          makeLatest: true
          body: |
            ${{ steps.extract-changelog.outputs.markdown }}

            ${{ env.SYNC_SUMMARY }}
          skipIfReleaseExists: true

      - name: Check if release was created
        id: check_release
        run: |
          if [ -z "${{ steps.create_release.outputs.html_url }}" ]; then
            echo "RELEASE_SKIPPED=true" >> $GITHUB_ENV
          else
            echo "RELEASE_SKIPPED=false" >> $GITHUB_ENV
          fi
